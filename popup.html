<!doctype html><html><head><meta charset="utf-8"><title>Sensitive Guard</title><style>body{width:330px;font:14px system-ui;margin:0;padding:16px;background:#f7f7f8}h2{margin:0}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.pill{padding:4px 8px;border-radius:99px;background:#e8f5e9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:white;border-radius:12px;padding:12px}.num{font-size:24px;font-weight:700}button{padding:8px 10px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}.primary{background:#111;color:white}.small{color:#666;font-size:12px}</style></head><body><h2>🛡️ Sensitive Guard</h2><div class="row"><span>Protection</span><span id="state" class="pill">ON</span></div><div class="grid"><div class="stat"><div>Blocked</div><div id="blocked" class="num">0</div></div><div class="stat"><div>Redacted</div><div id="redacted" class="num">0</div></div></div><p class="small">Local detection. Message content is not sent to a Sensitive Guard server.</p><div class="row"><button id="toggle">Turn off</button><button id="options" class="primary">Settings</button></div><script src="popup.js"></script></body></html>
